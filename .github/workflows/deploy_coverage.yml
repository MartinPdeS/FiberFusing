name: Coverage
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: write
  pull-requests: write
jobs:
  coverage:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_coverage.yml@v2
    with:
      python-version: "3.11"
      coverage-package: FiberFusing
    secrets:
      _GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
