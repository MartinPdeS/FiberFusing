[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FiberFusing"
version = "1.9.5"
description = "Parametrized fused-fiber cross-sections and refractive-index meshes."
license = {file = "LICENSE"}
readme = "README.rst"
requires-python = ">=3.10"
authors = [{ name="Martin Poinsinet de Sivry-Houle", email="martin.poinsinet.de.sivry@gmail.com"}]
classifiers = [
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: Implementation :: CPython',
    'Development Status :: 4 - Beta',
    'Topic :: Scientific/Engineering :: Physics',
    'License :: OSI Approved :: MIT License',
    'Intended Audience :: Science/Research',
]

keywords = [
    "fiber",
    "fusing",
]

dependencies = [
    "pyyaml",
    "pydantic>=2,<3",
    "scipy",
    "matplotlib>=3.8,<4",
    "numpy",
    "shapely >=2.0",
    "MPSPlots",
]

[project.urls]
Homepage = "https://github.com/MartinPdeS/FiberFusing"
Documentation = "https://martinpdes.github.io/FiberFusing/"
Repository = "https://github.com/MartinPdeS/FiberFusing.git"

[project.optional-dependencies]
release = ["martinpdes-maintenance==0.2.2"]
dev = ["ruff==0.17.2", "build>=1,<2", "twine>=7.0.0,<8"]
testing = [
    "tomli>=2; python_version < '3.11'",
    "pytest >=7.4,<10.0",
    "pytest-cov >=2,<7",
    "pytest-json-report ~=1.5",
    "flake8 ==7.3.0",
    "coverage ~=7.6"
]

documentation = ["MartinPdeS-docs>=0.3.2,<0.4"]

[tool.setuptools.packages.find]
include = ["FiberFusing", "FiberFusing.*"]

[tool.setuptools.package-data]
FiberFusing = ["fiber/fiber_files/*.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["FiberFusing/_version.py", "docs/source/gallery", "build"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mps-maintenance]
version-file = "FiberFusing/_version.py"
version-method = "literal"
conda-recipe = "conda.recipe/meta.yaml"
